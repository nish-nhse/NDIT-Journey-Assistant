<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>NDIT Journey Assistant</title>

    <link rel="stylesheet"
          href="styles.css">

</head>

<body>

    <header class="header">

        <div class="header-content">

            <img
                src="assets/nhs-logo.png"
                alt="NHS Logo"
                class="nhs-logo">

            <div>

                <h1>NDIT Journey Assistant</h1>

                <p>
                    National Data Integration Platform
                    Knowledge Graph Prototype
                </p>

            </div>

        </div>

    </header>

    <main class="container">

       <section class="search-panel">

    <h2>Find Guidance</h2>

    <p>
        Select your role and ask a question.
        The assistant will identify the most relevant
        guidance, collections, services and governance.
    </p>

    <label for="role">
        How are you using NDIT today?
    </label>

    <select id="role">

        <option value="Analyst">
            Analyst
        </option>

        <option value="Data Engineer">
            Data Engineer
        </option>

        <option value="Developer">
            Developer
        </option>

        <option value="Service Manager">
            Service Manager
        </option>

        <option value="Product Owner">
            Product Owner
        </option>

        <option value="Solution Architect">
            Solution Architect
        </option>

        <option value="Information Governance Lead">
            Information Governance Lead
        </option>

        <option value="Business User">
            Business User
        </option>

    </select>

    <label for="question">
        What would you like help with?
    </label>

    <textarea
        id="question"
        rows="4"
        placeholder="Example: I need to onboard a Cancer dataset into Foundry">
    </textarea>

    <button
        type="button"
        onclick="analyseQuestion()">

        Analyse Question

    </button>

</section>

    </main>

    <footer class="footer">

        <p>
            NHS England • NDIT Journey Assistant Prototype
        </p>

    </footer>

    <script src="app.js"></script>

</body>

</html>
